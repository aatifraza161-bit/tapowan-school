app = "tapowan-school-system"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"
  USER_DATA_PATH = "/data"

[mounts]
  source = "tapowan_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
